<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEautiful Merima Beric | Kosmetikstudio Stuttgart</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #e8b923;
            --dark: #1a1a1a;
            --light: #ffffff;
            --gray: #f8f8f8;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
            background: var(--light);
            overflow-x: hidden;
        }
        h1, h2, h3, h5 { font-family: 'Playfair Display', serif; }
        
        /* Navbar mit Logo */
        .navbar-brand img {
            height: 60px; /* Passe bei Bedarf an */
            margin-right: 12px;
        }
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold) !important;
            display: flex;
            align-items: center;
        }
        .nav-link {
            font-weight: 500;
            color: var(--dark) !important;
            margin: 0 10px;
            transition: color 0.3s;
        }
        .nav-link:hover { color: var(--gold) !important; }
        
        /* Hero */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero.jpg') center/cover no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            color: white;
            text-align: center;
        }
        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
        }
        .hero p.lead {
            font-size: 1.4rem;
            max-width: 700px;
            margin: 20px auto;
        }
        
        /* Sections */
        .section-title {
            font-size: 3rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 60px;
        }
        .service-card {
            background: white;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }
        .service-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .service-card img {
            height: 250px;
            object-fit: cover;
        }
        
        /* Galerie */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .gallery img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            transition: all 0.4s;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        /* WhatsApp Float */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: all 0.3s;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }
        
        footer {
            background: var(--dark);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        footer img {
            height: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>

        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="BEautiful Merima Beric Logo">
                <span>BEautiful Merima Beric</span>
            </a>

                <span
